<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast JS Obfuscator</title>
    
    <!-- Library Obfuscator -->
    <script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator/dist/index.browser.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { text-align: center; padding: 20px; }
        header h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { color: var(--muted); font-size: 0.9rem; }
        
        .container {
            display: flex;
            flex: 1;
            gap: 15px;
            padding: 0 15px 15px 15px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            height: 75vh;
        }
        .panel {
            flex: 1;
            background: var(--panel);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }
        .panel-header h2 { font-size: 1rem; font-weight: 500; }
        
        /* Style textarea anti-lag */
        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 15px;
            resize: none;
            outline: none;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
        }
        textarea::placeholder { color: #475569; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button.success { background: var(--success); }
        
        .main-btn-container { text-align: center; padding-bottom: 20px; }
        .main-btn {
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .status { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
        .status.ready { color: var(--success); }

        @media (max-width: 900px) {
            .container { flex-direction: column; height: auto; }
            .panel { min-height: 350px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Fast JS Obfuscator</h1>
        <p>Anti-Lag Text Editor</p>
    </header>

    <div class="container">
        <!-- Panel Input -->
        <div class="panel">
            <div class="panel-header">
                <h2>Input Code</h2>
                <button onclick="clearInput()">Clear</button>
            </div>
            <textarea id="inputArea" placeholder="Paste kode JavaScript bos di sini..." spellcheck="false"></textarea>
        </div>

        <!-- Panel Output -->
        <div class="panel">
            <div class="panel-header">
                <h2>Obfuscated Output</h2>
                <button class="success" onclick="copyOutput()">Copy</button>
            </div>
            <textarea id="outputArea" placeholder="Hasil akan muncul di sini..." readonly spellcheck="false"></textarea>
        </div>
    </div>

    <div class="status ready" id="statusText">✓ System Ready</div>

    <div class="main-btn-container">
        <button class="main-btn" id="btnObf" onclick="processObfuscate()">🚀 Obfuscate Now</button>
    </div>

    <script>
        const inputArea = document.getElementById('inputArea');
        const outputArea = document.getElementById('outputArea');
        const statusText = document.getElementById('statusText');
        const btnObf = document.getElementById('btnObf');

        function clearInput() {
            inputArea.value = "";
            outputArea.value = "";
            statusText.innerText = "✓ System Ready";
            statusText.className = "status ready";
        }

        function processObfuscate() {
            const code = inputArea.value;
            if (!code.trim()) return alert("⚠️ Masukkan kode terlebih dahulu!");

            // Ubah tampilan tombol dan status (Ubah ke Loading)
            btnObf.innerText = "⏳ Processing...";
            btnObf.disabled = true;
            statusText.innerText = "⏳ Sedang memproses (Mohon tunggu)";
            statusText.className = "status";

            // Gunakan setTimeout agar UI (Loading) bisa dirender dulu sebelum CPU bekerja berat
            setTimeout(() => {
                try {
                    const result = JavaScriptObfuscator.obfuscate(code, {
                        compact: true,
                        controlFlowFlattening: true,
                        deadCodeInjection: true,
                        stringArray: true,
                        stringArrayEncoding: ['base64'],
                        selfDefending: true,
                        identifierNamesGenerator: 'hexadecimal',
                        disableConsoleOutput: true
                    });

                    outputArea.value = result.getObfuscatedCode();
                    
                    statusText.innerText = "✅ Obfuscate Berhasil!";
                    statusText.className = "status ready";
                } catch (err) {
                    alert("❌ Gagal: " + err.message);
                    statusText.innerText = "❌ Error";
                } finally {
                    // Kembalikan tombol ke normal
                    btnObf.innerText = "🚀 Obfuscate Now";
                    btnObf.disabled = false;
                }
            }, 100); // Delay 100ms
        }

        function copyOutput() {
            if (!outputArea.value) return alert("⚠️ Belum ada hasil!");
            outputArea.select();
            document.execCommand('copy');
            alert("✅ Berhasil dicopy ke clipboard!");
        }
    </script>
</body>
</html>
